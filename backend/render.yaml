services:
  - type: web
    name: stockforage-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Set these in the Render dashboard (do NOT commit secrets):
      # - MONGO_URL
      # - JWT_SECRET
      # - FINN_APIKEY
